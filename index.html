const ADMIN_HASH="9de053625930a4f58ca45ccc7da183fb9cd17544f78f7aa8979222e7470bab8f";
async function hashPwd(p){
  const b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(p));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
}
let S={
  view:'login', user:null, isAdmin:false,
  nick:'', pass:'', adminPin:'', showPass:false, showAdmin:false,
  err:'', loading:false,
  price:1.0, hist:[1.0], players:[], reqs:[], 
  buy:10, sell:10, sendTo:'', sendAmt:10, reqAmt:100,
  showSend:false, showReq:false
};
async function loadMeta(){
  let {data} = await supabase.from('game_meta').select('*').eq('id',1).maybeSingle();
  if(!data){
    const ins = await supabase.from('game_meta').insert({id:1, price:1.0, price_history:[1.0], total_minted:0, total_burned:0}).select().single();
    data=ins.data;
  }
  if(data){ S.price=Number(data.price); S.hist=data.price_history||[1.0]; }
  draw();
}
async function loadPlayers(){
  const {data} = await supabase.from('players').select('*').order('points',{ascending:false}).limit(100);
  if(data) S.players=data;
  draw();
}
async function loadReqs(){
  const {data} = await supabase.from('requests').select('*').eq('status','pending').order('created_at',{ascending:false});
  if(data) S.reqs=data;
  draw();
}
async function login(){
  S.err=''; S.loading=true; draw();
  try{
    const nick=S.nick.trim().toLowerCase();
    if(!nick) throw new Error('Enter nickname');
    if(!S.pass) throw new Error('Enter password - this protects your account');
    const ph=await hashPwd(S.pass);
    let {data:ex, error} = await supabase.from('players').select('*').eq('nickname',nick).maybeSingle();
    if(error && error.code!=='PGRST116') throw error;
    if(!ex){
      const {data:cr, error:ie} = await supabase.from('players').insert({nickname:nick, password_hash:ph, points:0, caelcoin:0, txs:[]}).select().single();
      if(ie) throw ie;
      ex=cr;
    } else {
      if(!ex.password_hash){
        await supabase.from('players').update({password_hash:ph}).eq('nickname',nick);
        ex.password_hash=ph;
      } else if(ex.password_hash!==ph){
        throw new Error('Wrong password. Account is protected - friends cannot login as you.');
      }
    }
    let isAdmin=false;
    if(S.showAdmin && S.adminPin){
      const ah=await hashPwd(S.adminPin);
      if(ah===ADMIN_HASH) isAdmin=true;
      else throw new Error('Wrong admin PIN');
    }
    S.user=ex; S.isAdmin=isAdmin; S.view='app'; S.loading=false; S.err='';
    draw();
    loadMeta(); loadPlayers(); loadReqs();
    supabase.channel('live').on('postgres_changes',{event:'*',schema:'public',table:'players'},async()=>{
      loadPlayers();
      const {data} = await supabase.from('players').select('*').eq('nickname',S.user.nickname).single();
      if(data){ S.user=data; draw(); }
    }).on('postgres_changes',{event:'*',schema:'public',table:'game_meta'},()=>loadMeta()).on('postgres_changes',{event:'*',schema:'public',table:'requests'},()=>loadReqs()).subscribe();
  }catch(e){ S.err=e.message; S.loading=false; draw(); }
}
async function buy(){
  const amt=Number(S.buy); if(!amt) return;
  const cost=amt*S.price;
  if(S.user.points < cost){ S.err='Need '+cost.toFixed(2)+' points'; draw(); return; }
  const np=Number(S.user.points)-cost; const nc=Number(S.user.caelcoin)+amt;
  const txs=[...(S.user.txs||[]),{type:'BUY',amt,price:S.price,t:new Date().toISOString()}].slice(-50);
  const {error} = await supabase.from('players').update({points:np, caelcoin:nc, txs}).eq('nickname',S.user.nickname);
  if(error){ S.err=error.message; draw(); return; }
  const pump=Math.min(0.05, amt/500);
  const nprice=S.price*(1+pump);
  await supabase.from('game_meta').update({price:nprice, price_history:[...S.hist, nprice].slice(-40)}).eq('id',1);
  S.user.points=np; S.user.caelcoin=nc; S.err='Bought '+amt+' - price pumped!'; draw();
}
async function sell(){
  const amt=Number(S.sell); if(!amt) return;
  if(S.user.caelcoin < amt){ S.err='Not enough Caelcoin'; draw(); return; }
  const gain=amt*S.price;
  const np=Number(S.user.points)+gain; const nc=Number(S.user.caelcoin)-amt;
  const txs=[...(S.user.txs||[]),{type:'SELL',amt,price:S.price,t:new Date().toISOString()}].slice(-50);
  await supabase.from('players').update({points:np, caelcoin:nc, txs}).eq('nickname',S.user.nickname);
  const dump=Math.min(0.05, amt/500);
  const nprice=S.price*(1-dump);
  await supabase.from('game_meta').update({price:nprice, price_history:[...S.hist, nprice].slice(-40)}).eq('id',1);
  S.user.points=np; S.user.caelcoin=nc; S.err='Sold '+amt+' - price dumped'; draw();
}
async function requestPoints(){
  const amt=Number(S.reqAmt); if(!amt) return;
  await supabase.from('requests').insert({from_nick:S.user.nickname, amount:amt, status:'pending'});
  S.err='Requested '+amt+' pts - ask admin to approve'; S.showReq=false; draw();
}
async function sendPoints(){
  const to=S.sendTo.trim().toLowerCase(); const amt=Number(S.sendAmt);
  if(!to||!amt) return;
  if(S.user.points < amt){ S.err='Not enough points'; draw(); return; }
  const {data:target} = await supabase.from('players').select('*').eq('nickname',to).maybeSingle();
  if(!target){ S.err='User not found'; draw(); return; }
  await supabase.from('players').update({points:Number(S.user.points)-amt}).eq('nickname',S.user.nickname);
  await supabase.from('players').update({points:Number(target.points)+amt}).eq('nickname',to);
  S.user.points-=amt; S.err='Sent '+amt+' to '+to; S.showSend=false; draw();
}
async function approve(r){
  const {data:p} = await supabase.from('players').select('*').eq('nickname',r.from_nick).single();
  if(p){
    await supabase.from('players').update({points:Number(p.points)+Number(r.amount)}).eq('nickname',r.from_nick);
    await supabase.from('requests').update({status:'approved'}).eq('id',r.id);
    loadReqs(); loadPlayers();
  }
}
async function deny(r){ await supabase.from('requests').update({status:'denied'}).eq('id',r.id); loadReqs(); }

      <div class="flex items-center gap-1.5 px-3 py-1 bg-white rounded-full border text-[11px]"><div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>LIVE</div>
    </div>
    <div class="card p-6">

        <input value="${S.nick}" oninput="S.nick=this.value; draw();" placeholder="e.g. jake" class="w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-3.5 outline-none focus:border-black focus:bg-white">
        <div class="flex justify-between items-center mt-5 mb-2"><div class="text-[11px] tracking-widest text-gray-500">PASSWORD *</div><button onclick="S.showPass=!S.showPass; draw();" class="text-[11px] underline">${S.showPass?'Hide':'Show'}</button></div>
        <input value="${S.pass}" oninput="S.pass=this.value; draw();" type="${S.showPass?'text':'password'}" placeholder="Protects your account" class="w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-3.5 outline-none focus:border-black focus:bg-white">
        <label class="flex items-center gap-2 mt-5 cursor-pointer"><input type="checkbox" ${S.showAdmin?'checked':''} onchange="S.showAdmin=this.checked; draw();" class="w-4 h-4 rounded"><span class="text-[11px] tracking-widest">ADMIN?</span></label>
        ${S.showAdmin?`<input value="${S.adminPin}" oninput="S.adminPin=this.value; draw();" type="password" placeholder="Admin PIN" class="w-full mt-3 bg-gray-50 border border-gray-200 rounded-2xl px-4 py-3.5 outline-none">`:''}
        <button onclick="login()" class="w-full mt-6 bg-black text-white rounded-2xl py-4 font-bold tracking-widest text-sm">${S.loading?'CONNECTING...':'CREATE / LOGIN - START AT 0'}</button>

      </div>
